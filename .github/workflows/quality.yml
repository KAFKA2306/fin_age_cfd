name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Reject tracked runtime artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.venv|venv|__pycache__)(/|$)|\.pyc$|\.log$'; then
            echo 'Tracked runtime artifacts remain in the repository.' >&2
            exit 1
          fi
