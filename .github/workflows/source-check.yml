name: Government source check

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - src/collect_nhtsa_sgo.py
      - src/update_av_evidence.py
      - src/build_av_summary.py
      - .github/workflows/source-check.yml
  schedule:
    - cron: '17 14 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: government-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build live government evidence
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python src/update_av_evidence.py \
              --evidence-root build/data \
              --api-dir build/api/v1/autonomous-vehicles
            python src/build_av_summary.py --root build/api/v1/autonomous-vehicles
          else
            python src/update_av_evidence.py
            python src/build_av_summary.py
          fi
      - name: Audit normalized outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = (
              Path('build/api/v1/autonomous-vehicles')
              if '${{ github.event_name }}' == 'pull_request'
              else Path('api/v1/autonomous-vehicles')
          )
          nhtsa = json.loads((root/'nhtsa-sgo.json').read_text())
          dmv = json.loads((root/'california-dmv.json').read_text())
          summary = json.loads((root/'summary.json').read_text())
          index = json.loads((root/'index.json').read_text())

          assert set(nhtsa['categories']) == {'ads', 'level_2_adas', 'other'}
          for category in ('ads', 'level_2_adas'):
              view = nhtsa['categories'][category]
              assert view['latest_report_count'] > 0
              assert view['monthly_report_counts_2024_plus']
              assert view['california_monthly_report_counts_2024_plus']
              assert summary['nhtsa_sgo'][category]['latest_report_count'] == view['latest_report_count']
          assert 'safety rate' in nhtsa['comparison_warning']
          assert 'records' not in summary['nhtsa_sgo']['ads']

          reports = dmv['company_testing_reports']
          latest_year = max(reports, key=int)
          report_year = int(latest_year)
          report = reports[latest_year]
          assert report['report_year'] == report_year
          assert report['period'] == {
              'start': f'{report_year - 1}-12-01',
              'end': f'{report_year}-11-30',
          }
          assert report['companies']
          assert report['events']
          assert any(item['autonomous_testing_miles'] > 0 for item in report['companies'])
          for company in report['companies']:
              if company['testing_miles_per_disengagement'] is not None:
                  assert company['source_count_match'] is True
                  assert company['reported_disengagements'] > 0
          assert summary['california_dmv']['latest_report_year'] == report_year
          assert summary['california_dmv']['period'] == report['period']
          assert summary['california_dmv']['autonomous_testing_miles'] == round(
              sum(item['autonomous_testing_miles'] for item in report['companies']), 3
          )
          assert summary['california_dmv']['reported_disengagements'] == sum(
              item['reported_disengagements'] for item in report['companies']
          )
          statewide = max(
              (
                  item
                  for item in dmv['statewide_testing_observations']
                  if item['metric'] == 'public_road_testing_miles'
              ),
              key=lambda item: (item['period_end'], item['period_start']),
          )
          compact_statewide = summary['california_dmv'][
              'latest_statewide_public_road_testing_miles'
          ]
          assert compact_statewide['period'] == {
              'start': statewide['period_start'],
              'end': statewide['period_end'],
          }
          assert compact_statewide['value'] == statewide['value']
          assert compact_statewide.get('qualifier') == statewide.get('qualifier')
          assert compact_statewide['unit'] == statewide['unit']
          assert compact_statewide['scope'] == statewide['scope']
          assert compact_statewide['source_url'] == statewide['source_url']
          assert 'companies' not in summary['california_dmv']
          assert len(dmv['permit_snapshot']['permit_categories']) == 3
          assert set(index['views']) == {'nhtsa_sgo', 'california_dmv'}
          assert all(not value.startswith('/') for value in index['evidence'].values())
          PY
      - name: Commit new evidence revision and views
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nhtsa data/california/dmv api/v1/autonomous-vehicles
          if git diff --cached --quiet; then
            echo 'No government evidence change.'
            exit 0
          fi
          git commit -m 'data: update autonomous vehicle evidence'
          git push
