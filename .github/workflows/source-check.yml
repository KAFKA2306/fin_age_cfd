name: NHTSA source check

on:
  pull_request:
    paths:
      - 'src/collect_nhtsa_sgo.py'
      - '.github/workflows/source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch current NHTSA CSV manifests
        run: python src/collect_nhtsa_sgo.py --output /tmp/sgo-manifest.json
