name: Government source check

on:
  pull_request:
  schedule:
    - cron: '17 14 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-government-sources:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect official NHTSA and DMV schemas
        run: |
          python - <<'PY'
          import csv, io, json, sys, urllib.request, urllib.error
          sys.path.insert(0, 'src')
          import collect_nhtsa_sgo

          manifest, raw_files = collect_nhtsa_sgo.collect_sources()
          for category, raw in raw_files.items():
              reader = csv.DictReader(io.StringIO(raw.decode('utf-8-sig', errors='replace')))
              row = next(reader, {})
              print(json.dumps({'source':'nhtsa','category':category,'headers':reader.fieldnames,'sample':row}, ensure_ascii=False))

          for slug in ('2024-autonomous-vehicle-disengagement-reports-csv', '2024-autonomous-mileage-reports-csv'):
              url=f'https://www.dmv.ca.gov/portal/file/{slug}/'
              req=urllib.request.Request(url, headers={'User-Agent':'autonomous-vehicles/1.0 github.com/KAFKA2306/autonomous-vehicles'})
              raw=urllib.request.urlopen(req, timeout=60).read()
              reader=csv.DictReader(io.StringIO(raw.decode('utf-8-sig', errors='replace')))
              row=next(reader, {})
              print(json.dumps({'source':'dmv','slug':slug,'headers':reader.fieldnames,'sample':row}, ensure_ascii=False))
          PY
