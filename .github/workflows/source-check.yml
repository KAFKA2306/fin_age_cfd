name: Government source check

on:
  pull_request:
  schedule:
    - cron: '17 14 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-nhtsa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch current NHTSA CSV manifests
        if: github.event_name == 'pull_request'
        run: python src/collect_nhtsa_sgo.py --output /tmp/sgo-manifest.json
      - name: Store NHTSA source revision
        if: github.event_name != 'pull_request'
        run: python src/collect_nhtsa_sgo.py --revision-dir data/nhtsa/sgo/revisions
      - name: Commit new NHTSA source revision
        if: github.event_name != 'pull_request'
        run: |
          if test -z "$(git status --porcelain -- data/nhtsa/sgo/revisions)"; then
            echo 'No new NHTSA SGO revision.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nhtsa/sgo/revisions
          git commit -m 'data: snapshot NHTSA SGO revision'
          git push

  inspect-dmv:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover official DMV CSV endpoints
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request, urllib.error
          slugs = [
              '2023-autonomous-vehicle-disengagement-reports-csv',
              '2024-autonomous-vehicle-disengagement-reports-csv',
              '2025-autonomous-vehicle-disengagement-reports-csv',
              '2024-autonomous-mileage-reports-csv',
              '2024-autonomous-vehicle-mileage-reports-csv',
              '2024-autonomous-mileage-report-csv',
              '2025-autonomous-mileage-reports-csv',
              '2025-autonomous-vehicle-mileage-reports-csv',
          ]
          for slug in slugs:
              url=f'https://www.dmv.ca.gov/portal/file/{slug}/'
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':'autonomous-vehicles/1.0 github.com/KAFKA2306/autonomous-vehicles'})
                  raw=urllib.request.urlopen(req, timeout=60).read()
                  text=raw.decode('utf-8-sig', errors='replace')
                  reader=csv.DictReader(io.StringIO(text))
                  row=next(reader, {})
                  print(json.dumps({'slug':slug,'status':200,'bytes':len(raw),'headers':reader.fieldnames,'sample':row}, ensure_ascii=False))
              except urllib.error.HTTPError as exc:
                  print(json.dumps({'slug':slug,'status':exc.code}))
          PY
